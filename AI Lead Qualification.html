<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Enterprise Solutions</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f5; display: flex; justify-content: center; padding: 50px; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <form id="leadForm">
        <h2>Let's discuss your project</h2>
        <label>Name</label>
        <input type="text" id="name" required>
        
        <label>Email</label>
        <input type="email" id="email" required>
        
        <label>Company</label>
        <input type="text" id="company">
        
        <label>Estimated Budget ($)</label>
        <input type="number" id="budget" required>
        
        <label>Message</label>
        <textarea id="message" rows="4" required></textarea>
        
        <button type="submit">Submit Inquiry</button>
    </form>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Replace this with your n8n Production Webhook URL
            // const YOUR_N8N_PRODUCTION_URL_HERE = 'http://localhost:5678/webhook-test/648815de-4b17-448b-a566-ec8a0b16cb8a';
            const webhookUrl = 'http://localhost:5678/webhook-test/648815de-4b17-448b-a566-ec8a0b16cb8a'; 
            // const webhookUrl = 'http://localhost:5678/webhook/648815de-4b17-448b-a566-ec8a0b16cb8a'; // productive webhook URL
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                company: document.getElementById('company').value,
                budget: document.getElementById('budget').value,
                message: document.getElementById('message').value
            };

            try {
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('Thanks! We have received your inquiry.');
                document.getElementById('leadForm').reset();
            } catch (error) {
                alert('Error submitting form.');
            }
        });
    </script>
</body>
</html>
